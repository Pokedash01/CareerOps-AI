name: CareerOps Fast Poll
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  poll-inbox:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Poll Telegram Inbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py --mode poll-only
      - name: Commit State to GitHub
        run: |
          git config --global user.name "CareerOps-Bot"
          git config --global user.email "bot@careerops.ai"
          git add data/
          git diff --staged --quiet || git commit -m "chore: Fast-poll state update [skip ci]"
          git push
