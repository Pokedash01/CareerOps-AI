name: CareerOps Autonomous Engine
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
      - name: Commit State & User Data to GitHub
        run: |
          git config --global user.name "CareerOps-Bot"
          git config --global user.email "bot@careerops.ai"
          git add data/
          git commit -m "chore: Auto-update user state and resumes [skip ci]" || echo "No new data to commit"
          git push
